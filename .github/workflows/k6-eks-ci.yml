name: k6-eks-ci

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check-out web-app repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build, tag, and push web-app image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}        
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest -f ./Dockerfile .
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest
  
      - name: Set up kube config for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}
      
      - name: Remove old configmap for tests
        run: |
          kubectl delete configmap scenarios-test
      
      - name: Setup new configmap for tests
        run: |
          kubectl create configmap scenarios-test --from-file=./test
      
      - name: Check-out templates repository
        uses: actions/checkout@v4   
        with:
          repository: vm622/k6-eks-templates
          ref: master          
          token: ${{ secrets.PAT_K6_EKS_TEMPLATES_REPO }}
      
      - name: Deploy web-app to EKS
        run: |
          kubectl apply -f ./web-app.yaml
      
      - name: Deploy K6 test runner
        run: |
          kubectl apply -f ./k6-test.yaml
