openapi: 3.0.0
info:
  title: Fastify API
  description: API documentation for a Fastify-based application.
  version: 1.0.0
paths:
  /:
    get:
      summary: Get users
      description: Fetches a list of users in the system.
      operationId: getUsers
      tags:
        - User
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        username:
                          type: string
                        password:
                          type: string
                example:
                  users:
                    user1:
                      username: user1
                      password: password1
                    user2:
                      username: user2
                      password: password2

  /login:
    post:
      summary: Login user
      description: Allows a user to log in by providing a username and password.
      operationId: loginUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: user1
                password:
                  type: string
                  example: password1
              required:
                - username
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  username:
                    type: string
                    example: user1
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid username or password

  /logout:
    post:
      summary: Logout user
      description: Logs out the user and clears their session.
      operationId: logoutUser
      tags:
        - User
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful
        '401':
          description: User not logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not logged in

  /health/liveness:
    get:
      summary: Liveness check
      description: Checks if the service is alive.
      operationId: healthLiveness
      tags:
        - Health
      responses:
        '204':
          description: Service is alive

  /health/readiness:
    get:
      summary: Readiness check
      description: Checks if the service is ready to handle traffic.
      operationId: healthReadiness
      tags:
        - Health
      responses:
        '204':
          description: Service is ready
